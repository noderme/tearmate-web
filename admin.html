<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withly Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple: #7c5cbf;
    --purple-light: #a98fd4;
    --purple-soft: #f0ebfa;
    --cream: #faf8f5;
    --dark: #1a1523;
    --muted: #8a7f99;
    --border: #e8e2f0;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f97316;
    --surface: #fff;
  }
  body { font-family: system-ui, sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; }

  #auth-screen {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .auth-card {
    background: var(--surface); border-radius: 16px; padding: 40px;
    width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center;
  }
  .auth-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .auth-card p { color: var(--muted); font-size: 0.875rem; margin-bottom: 28px; }
  .auth-card input {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 0.9rem; margin-bottom: 12px; outline: none;
    transition: border-color 0.2s;
  }
  .auth-card input:focus { border-color: var(--purple); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 8px; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s;
    text-decoration: none;
  }
  .btn:hover { opacity: 0.85; }
  .btn-google {
    background: #fff; color: #1a1523; border: 1.5px solid var(--border);
    width: 100%; justify-content: center; font-size: 0.95rem;
  }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-danger  { background: var(--red); color: #fff; }
  .btn-success { background: var(--green); color: #fff; }
  .btn-muted   { background: var(--border); color: var(--dark); }
  #auth-error  { color: var(--red); font-size: 0.8rem; margin-top: 12px; min-height: 18px; }

  #app { display: none; min-height: 100vh; }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-brand { font-weight: 700; font-size: 1.1rem; color: var(--purple); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-email { font-size: 0.8rem; color: var(--muted); }

  .layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar {
    width: 210px; background: var(--surface); border-right: 1px solid var(--border);
    padding: 20px 12px; display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 56px; height: calc(100vh - 56px);
  }
  .nav-item {
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    font-size: 0.875rem; font-weight: 500; color: var(--muted);
    transition: background 0.15s, color 0.15s; display: flex; align-items: center; gap: 8px;
  }
  .nav-item:hover { background: var(--purple-soft); color: var(--purple); }
  .nav-item.active { background: var(--purple-soft); color: var(--purple); font-weight: 700; }
  .badge {
    margin-left: auto; background: var(--red); color: #fff;
    border-radius: 99px; font-size: 0.7rem; font-weight: 700;
    padding: 1px 6px; min-width: 18px; text-align: center;
  }

  .main { flex: 1; padding: 28px 32px; overflow-y: auto; }
  .page { display: none; }
  .page.active { display: block; }

  h2 { font-size: 1.4rem; margin-bottom: 20px; }
  .stat-row { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; min-width: 140px;
  }
  .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 4px; color: var(--purple); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  th { background: var(--purple-soft); text-align: left; padding: 10px 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--purple); }
  td { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.875rem; vertical-align: middle; }
  tr:hover td { background: #faf9fd; }

  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 99px;
    font-size: 0.75rem; font-weight: 600;
  }
  .pill-pending  { background: #fef9c3; color: #854d0e; }
  .pill-approved { background: #dcfce7; color: #166534; }
  .pill-rejected { background: #fee2e2; color: #991b1b; }
  .pill-open     { background: #fee2e2; color: #991b1b; }
  .pill-reviewed { background: #dcfce7; color: #166534; }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
    background: var(--purple-soft); display: inline-block; vertical-align: middle;
  }
  .selfie-link { color: var(--purple); text-decoration: underline; font-size: 0.8rem; }
  .action-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  .loading { color: var(--muted); padding: 20px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 16px; padding: 28px;
    width: 480px; max-width: 95vw; max-height: 80vh; overflow-y: auto;
  }
  .modal h3 { font-size: 1.1rem; margin-bottom: 16px; }
  .modal-close { float: right; cursor: pointer; font-size: 1.2rem; color: var(--muted); background: none; border: none; }
  .detail-row { margin-bottom: 10px; font-size: 0.875rem; }
  .detail-row span { color: var(--muted); margin-right: 6px; }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>Withly Admin</h1>
    <p>Admin access only.</p>
    <input type="email" id="email-input" placeholder="Email" autocomplete="email" />
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
    <button class="btn btn-primary" onclick="doSignIn()">Sign in</button>
    <div id="auth-error"></div>
  </div>
</div>

<!-- App shell -->
<div id="app">
  <div class="topbar">
    <span class="topbar-brand">Withly Admin</span>
    <div class="topbar-right">
      <span class="topbar-email" id="user-email"></span>
      <button class="btn btn-muted" onclick="doSignOut()">Sign out</button>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar">
      <div class="nav-item active" data-page="verifications" onclick="showPage('verifications')">
        🪪 Verifications <span class="badge" id="badge-verifications" style="display:none"></span>
      </div>
      <div class="nav-item" data-page="reports" onclick="showPage('reports')">
        🚩 Reports <span class="badge" id="badge-reports" style="display:none"></span>
      </div>
      <div class="nav-item" data-page="users" onclick="showPage('users')">
        👥 Users
      </div>
    </nav>
    <main class="main">
      <div class="page active" id="page-verifications">
        <h2>Helper Verifications</h2>
        <div id="verifications-content"><div class="loading">Loading…</div></div>
      </div>
      <div class="page" id="page-reports">
        <h2>User Reports</h2>
        <div id="reports-content"><div class="loading">Loading…</div></div>
      </div>
      <div class="page" id="page-users">
        <h2>All Users</h2>
        <div id="users-content"><div class="loading">Loading…</div></div>
      </div>
    </main>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detail-modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, where, getDocs, doc, updateDoc, getDoc, orderBy, limit }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app  = initializeApp({
  apiKey:            'AIzaSyAzgmWSRvpGxIk3GzxcGNkGE82IyZoKRUo',
  authDomain:        'tearmate-3a101.firebaseapp.com',
  projectId:         'tearmate-3a101',
  storageBucket:     'tearmate-3a101.firebasestorage.app',
  messagingSenderId: '855013076047',
  appId:             '1:855013076047:ios:ed95cb4892fe5817b38e3a',
  databaseURL:       'https://tearmate-3a101-default-rtdb.firebaseio.com/',
});
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Auth ──────────────────────────────────────────────────────────────────────
window.doSignIn = async () => {
  const email = document.getElementById('email-input').value.trim();
  const pass  = document.getElementById('password-input').value;
  document.getElementById('auth-error').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    document.getElementById('auth-error').textContent = 'Invalid email or password.';
  }
};
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('password-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.doSignIn();
  });
});

window.doSignOut = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return;
  }
  // Check isAdmin on Firestore user doc
  const userDoc = await getDoc(doc(db, 'users', user.uid));
  if (!userDoc.exists() || !userDoc.data().isAdmin) {
    await signOut(auth);
    document.getElementById('auth-error').textContent =
      'Access denied. Your account does not have admin privileges.';
    return;
  }
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-email').textContent = user.email || user.displayName;
  loadAll();
});

// ── Navigation ────────────────────────────────────────────────────────────────
window.showPage = (name) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector(`[data-page="${name}"]`).classList.add('active');
};

window.closeModal = () => document.getElementById('detail-modal').classList.remove('open');
window.handleOverlayClick = (e) => { if (e.target === e.currentTarget) closeModal(); };

// ── Load all ──────────────────────────────────────────────────────────────────
function loadAll() {
  loadVerifications();
  loadReports();
  loadUsers();
}

// ── Verifications ─────────────────────────────────────────────────────────────
async function loadVerifications() {
  try {
    const snap = await getDocs(query(
      collection(db, 'helperProfiles'),
      where('verificationStatus', '==', 'pending'),
    ));

    // Client-side filter: only those with selfieUrl
    const pending = snap.docs.filter(d => d.data().selfieUrl);

    const badge = document.getElementById('badge-verifications');
    badge.textContent = pending.length;
    badge.style.display = pending.length > 0 ? 'inline' : 'none';

    if (pending.length === 0) {
      document.getElementById('verifications-content').innerHTML =
        '<div class="empty">No pending verifications 🎉</div>';
      return;
    }

    const rows = await Promise.all(pending.map(async (d) => {
      const hp = d.data();
      const userSnap = await getDoc(doc(db, 'users', hp.uid));
      return { hp, user: userSnap.exists() ? userSnap.data() : {} };
    }));

    document.getElementById('verifications-content').innerHTML = `
      <table>
        <thead><tr>
          <th>Photo</th><th>Name</th><th>Phone</th><th>Selfie</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${rows.map(({ hp, user }) => `
            <tr>
              <td>${user.photo ? `<img class="avatar" src="${user.photo}" />` : '<div class="avatar"></div>'}</td>
              <td>${esc(user.name)}</td>
              <td>${esc(user.phoneNumber)}</td>
              <td>${hp.selfieUrl
                ? `<a class="selfie-link" href="${hp.selfieUrl}" target="_blank">View ↗</a>`
                : '—'}</td>
              <td>
                <div class="action-row">
                  <button class="btn btn-success" onclick="approveHelper('${hp.uid}')">Approve</button>
                  <button class="btn btn-danger"  onclick="rejectHelper('${hp.uid}')">Reject</button>
                  <button class="btn btn-muted"   onclick="viewUser('${hp.uid}')">Details</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    document.getElementById('verifications-content').innerHTML =
      `<div class="empty">Error loading verifications: ${e.message}</div>`;
  }
}

window.approveHelper = async (uid) => {
  if (!confirm('Approve this helper?')) return;
  await updateDoc(doc(db, 'helperProfiles', uid), { verificationStatus: 'approved' });
  await updateDoc(doc(db, 'users', uid), { isVerified: true });
  loadVerifications();
};

window.rejectHelper = async (uid) => {
  if (!confirm('Reject this helper?')) return;
  await updateDoc(doc(db, 'helperProfiles', uid), { verificationStatus: 'rejected' });
  loadVerifications();
};

// ── Reports ───────────────────────────────────────────────────────────────────
async function loadReports() {
  try {
    // Simple query — no compound index needed; sort client-side
    const snap = await getDocs(query(
      collection(db, 'reports'),
      where('reviewed', '==', false),
    ));

    const reports = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    const badge = document.getElementById('badge-reports');
    badge.textContent = reports.length;
    badge.style.display = reports.length > 0 ? 'inline' : 'none';

    if (reports.length === 0) {
      document.getElementById('reports-content').innerHTML =
        '<div class="empty">No open reports 🎉</div>';
      return;
    }

    const rows = await Promise.all(reports.map(async (r) => {
      const [repSnap, repedSnap] = await Promise.all([
        getDoc(doc(db, 'users', r.reporterId)),
        getDoc(doc(db, 'users', r.reportedId)),
      ]);
      return {
        ...r,
        reporterName: repSnap.exists() ? repSnap.data().name : r.reporterId,
        reportedName: repedSnap.exists() ? repedSnap.data().name : r.reportedId,
      };
    }));

    document.getElementById('reports-content').innerHTML = `
      <table>
        <thead><tr>
          <th>Date</th><th>Reporter</th><th>Reported</th><th>Reason</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '—'}</td>
              <td>${esc(r.reporterName)}</td>
              <td>${esc(r.reportedName)}</td>
              <td>${esc(r.reason)}</td>
              <td>
                <div class="action-row">
                  <button class="btn btn-muted"
                    onclick="viewReport('${r.id}','${esc(r.reportedName)}','${esc(r.reason)}','${esc(r.details)}','${r.reportedId}')">
                    View
                  </button>
                  <button class="btn btn-success" onclick="markReviewed('${r.id}')">Dismiss</button>
                  <button class="btn btn-danger"  onclick="suspendUser('${r.reportedId}','${r.id}')">Suspend</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    document.getElementById('reports-content').innerHTML =
      `<div class="empty">Error loading reports: ${e.message}</div>`;
  }
}

window.viewReport = (id, name, reason, details, reportedId) => {
  document.getElementById('modal-body').innerHTML = `
    <h3>Report — ${name}</h3>
    <div class="detail-row"><span>Reason:</span> ${reason}</div>
    <div class="detail-row"><span>Details:</span> ${details || 'None provided'}</div>
    <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-success" onclick="markReviewed('${id}');closeModal()">Dismiss</button>
      <button class="btn btn-danger"  onclick="suspendUser('${reportedId}','${id}');closeModal()">Suspend user</button>
      <button class="btn btn-muted"   onclick="closeModal()">Close</button>
    </div>`;
  document.getElementById('detail-modal').classList.add('open');
};

window.markReviewed = async (reportId) => {
  await updateDoc(doc(db, 'reports', reportId), { reviewed: true, reviewedAt: Date.now() });
  loadReports();
};

window.suspendUser = async (uid, reportId) => {
  if (!confirm('Suspend this user?')) return;
  await updateDoc(doc(db, 'users', uid), { isSuspended: true });
  await updateDoc(doc(db, 'reports', reportId), { reviewed: true, reviewedAt: Date.now(), action: 'suspended' });
  loadReports();
  loadUsers();
};

// ── Users ─────────────────────────────────────────────────────────────────────
async function loadUsers() {
  try {
    const snap = await getDocs(query(
      collection(db, 'users'),
      orderBy('createdAt', 'desc'),
      limit(200),
    ));

    const users = snap.docs.map(d => d.data());
    const total     = users.length;
    const helpers   = users.filter(u => u.role === 'helper').length;
    const seekers   = users.filter(u => u.role === 'seeker').length;
    const suspended = users.filter(u => u.isSuspended).length;

    document.getElementById('users-content').innerHTML = `
      <div class="stat-row">
        <div class="stat-card"><div class="label">Total</div><div class="value">${total}</div></div>
        <div class="stat-card"><div class="label">Helpers</div><div class="value">${helpers}</div></div>
        <div class="stat-card"><div class="label">Seekers</div><div class="value">${seekers}</div></div>
        <div class="stat-card"><div class="label">Suspended</div><div class="value" style="color:var(--red)">${suspended}</div></div>
      </div>
      <table>
        <thead><tr>
          <th>Photo</th><th>Name</th><th>Role</th><th>Joined</th><th>Rating</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td>${u.photo ? `<img class="avatar" src="${u.photo}" />` : '<div class="avatar"></div>'}</td>
              <td>${esc(u.name)}</td>
              <td>${u.role || '—'}</td>
              <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</td>
              <td>${u.averageRating ? '⭐ ' + Number(u.averageRating).toFixed(1) : '—'}</td>
              <td>
                ${u.isSuspended
                  ? '<span class="pill pill-rejected">Suspended</span>'
                  : '<span class="pill pill-approved">Active</span>'}
              </td>
              <td>
                <div class="action-row">
                  <button class="btn btn-muted" onclick="viewUser('${u.uid}')">Details</button>
                  ${u.isSuspended
                    ? `<button class="btn btn-success" onclick="unsuspendUser('${u.uid}')">Unsuspend</button>`
                    : `<button class="btn btn-danger"  onclick="suspendUserDirect('${u.uid}')">Suspend</button>`}
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    document.getElementById('users-content').innerHTML =
      `<div class="empty">Error loading users: ${e.message}</div>`;
  }
}

window.viewUser = async (uid) => {
  const [userSnap, hpSnap] = await Promise.all([
    getDoc(doc(db, 'users', uid)),
    getDoc(doc(db, 'helperProfiles', uid)),
  ]);
  const u  = userSnap.exists() ? userSnap.data() : {};
  const hp = hpSnap.exists() ? hpSnap.data() : null;

  document.getElementById('modal-body').innerHTML = `
    <h3>${esc(u.name) || 'Unknown'}</h3>
    ${u.photo ? `<img src="${u.photo}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:14px;" />` : ''}
    <div class="detail-row"><span>UID:</span> ${uid}</div>
    <div class="detail-row"><span>Phone:</span> ${esc(u.phoneNumber)}</div>
    <div class="detail-row"><span>Role:</span> ${u.role || '—'}</div>
    <div class="detail-row"><span>DOB:</span> ${u.dateOfBirth || '—'}</div>
    <div class="detail-row"><span>Sessions:</span> ${u.totalSessions || 0}</div>
    <div class="detail-row"><span>Rating:</span> ${u.averageRating ? Number(u.averageRating).toFixed(1) : '—'}</div>
    <div class="detail-row"><span>Suspended:</span> ${u.isSuspended ? '⛔ Yes' : 'No'}</div>
    ${hp ? `
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
        <strong>Helper Profile</strong><br><br>
        <div class="detail-row"><span>Verification:</span>
          <span class="pill pill-${hp.verificationStatus}">${hp.verificationStatus}</span>
        </div>
        <div class="detail-row"><span>Available now:</span> ${hp.isAvailableNow ? '🟢 Yes' : '⚫ No'}</div>
        <div class="detail-row"><span>Reviews:</span> ${hp.totalReviews || 0}</div>
        ${hp.selfieUrl
          ? `<div class="detail-row"><a class="selfie-link" href="${hp.selfieUrl}" target="_blank">View selfie ↗</a></div>`
          : ''}
      </div>` : ''}
    <div style="margin-top:18px;display:flex;gap:8px;">
      ${u.isSuspended
        ? `<button class="btn btn-success" onclick="unsuspendUser('${uid}');closeModal()">Unsuspend</button>`
        : `<button class="btn btn-danger"  onclick="suspendUserDirect('${uid}');closeModal()">Suspend</button>`}
      <button class="btn btn-muted" onclick="closeModal()">Close</button>
    </div>`;
  document.getElementById('detail-modal').classList.add('open');
};

window.unsuspendUser = async (uid) => {
  if (!confirm('Unsuspend this user?')) return;
  await updateDoc(doc(db, 'users', uid), { isSuspended: false });
  loadUsers();
};

window.suspendUserDirect = async (uid) => {
  if (!confirm('Suspend this user?')) return;
  await updateDoc(doc(db, 'users', uid), { isSuspended: true });
  loadUsers();
};

// ── Util ──────────────────────────────────────────────────────────────────────
function esc(str) {
  return (str || '—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
