<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Screen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; width: 1242px; height: 2688px; margin: 0; }
  .phone-wrap { zoom: 2.9; }

  .phone {
    width: 393px;
    height: 852px;
    background: #f5f5f7;
    border-radius: 50px;
    border: 10px solid #1a1a1a;
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
  }

  .status-bar {
    background: #f5f5f7;
    padding: 14px 28px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
  }

  .header {
    background: #f5f5f7;
    padding: 4px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .greeting { font-size: 20px; font-weight: 700; color: #1a1523; }
  .tagline { font-size: 13px; color: #8a7f99; }
  .mode-btn {
    background: #f0ebfa;
    color: #7c5cbf;
    border: none;
    padding: 8px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
  }

  .crisis-banner {
    background: #FFF3CD;
    padding: 8px 20px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #856404;
    border-bottom: 1px solid #FFECB5;
  }

  .toggle-row {
    background: #f5f5f7;
    padding: 8px 20px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .toggle-btn {
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    border: 1.5px solid #e8e2f0;
    background: white;
    color: #8a7f99;
  }
  .toggle-btn.active { background: #7c5cbf; color: white; border-color: #7c5cbf; }
  .radius-chip {
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 12px;
    border: 1.5px solid #e8e2f0;
    background: white;
    color: #8a7f99;
  }
  .radius-chip.active { border-color: #7c5cbf; color: #7c5cbf; font-weight: 600; }

  .map {
    position: relative;
    height: 380px;
    background: #e8f4e8;
    overflow: hidden;
  }
  .map img { width: 100%; height: 100%; object-fit: cover; }
  .map-bg {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #d4e8c2 0%, #b8d4a8 30%, #c8ddb8 60%, #d8e8c8 100%);
    position: relative;
  }
  /* Streets */
  .street-h { position: absolute; background: white; opacity: 0.7; height: 8px; width: 100%; }
  .street-v { position: absolute; background: white; opacity: 0.7; width: 8px; height: 100%; }

  .count-badge {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    color: #1a1523;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .marker {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .marker-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: white;
  }
  .marker-dot { width: 8px; height: 8px; background: #7c5cbf; border-radius: 50%; margin-top: 2px; }
  .online-dot {
    width: 10px; height: 10px;
    background: #34c759;
    border-radius: 50%;
    border: 2px solid white;
    position: absolute;
    bottom: 12px;
    right: 0;
  }

  .my-location {
    position: absolute;
    width: 16px;
    height: 16px;
    background: #007AFF;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 0 8px rgba(0,122,255,0.15);
  }

  .helpers-row {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    overflow-x: auto;
  }
  .helper-card {
    background: white;
    border-radius: 16px;
    padding: 12px;
    min-width: 130px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .helper-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: white;
    position: relative;
  }
  .helper-name { font-size: 12px; font-weight: 600; color: #1a1523; text-align: center; }
  .helper-stars { font-size: 10px; color: #f59e0b; }
  .helper-dist { font-size: 11px; color: #8a7f99; }

  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #e8e2f0;
    display: flex;
    padding: 8px 0 28px;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab-icon { font-size: 22px; }
  .tab-label { font-size: 10px; color: #8a7f99; font-weight: 500; }
  .tab.active .tab-label { color: #7c5cbf; }
</style>
</head>
<body>
<div class="phone-wrap"><div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●</span>
    <span>⬛ 100%</span>
  </div>

  <div class="header">
    <div>
      <div class="greeting">Hi Sarah 👋</div>
      <div class="tagline">Find someone to be with</div>
    </div>
    <button class="mode-btn">🤗 Be a Helper</button>
  </div>

  <div class="crisis-banner">
    <span>🆘 In crisis? Call <strong>988</strong> or text HOME to <strong>741741</strong></span>
    <span>✕</span>
  </div>

  <div class="toggle-row">
    <div class="toggle-btn active">🗺 Map</div>
    <div class="toggle-btn">📋 List</div>
    <div class="radius-chip">1km</div>
    <div class="radius-chip">5km</div>
    <div class="radius-chip active">10km</div>
    <div class="radius-chip">25km</div>
  </div>

  <div class="map">
    <div class="map-bg">
      <div class="street-h" style="top:30%"></div>
      <div class="street-h" style="top:55%"></div>
      <div class="street-h" style="top:75%"></div>
      <div class="street-v" style="left:25%"></div>
      <div class="street-v" style="left:55%"></div>
      <div class="street-v" style="left:80%"></div>
    </div>

    <div class="count-badge">4 helpers nearby</div>

    <!-- My location -->
    <div class="my-location" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div>

    <!-- Markers -->
    <div class="marker" style="top:28%;left:35%">
      <div class="marker-avatar" style="background:#7c5cbf;">JM<div class="online-dot"></div></div>
      <div class="marker-dot"></div>
    </div>
    <div class="marker" style="top:20%;left:62%">
      <div class="marker-avatar" style="background:#a98fd4;">AR<div class="online-dot"></div></div>
      <div class="marker-dot"></div>
    </div>
    <div class="marker" style="top:40%;left:72%">
      <div class="marker-avatar" style="background:#6b5ca5;">TC<div class="online-dot"></div></div>
      <div class="marker-dot"></div>
    </div>
    <div class="marker" style="top:35%;left:18%">
      <div class="marker-avatar" style="background:#9b7fd4;">ML<div class="online-dot"></div></div>
      <div class="marker-dot"></div>
    </div>

    <!-- Helper cards -->
    <div class="helpers-row">
      <div class="helper-card">
        <div class="helper-avatar" style="background:#7c5cbf;">JM<div class="online-dot" style="position:absolute;bottom:0;right:0;width:12px;height:12px;background:#34c759;border:2px solid white;border-radius:50%;"></div></div>
        <div class="helper-name">James M.</div>
        <div class="helper-stars">★★★★★</div>
        <div class="helper-dist">0.4km away</div>
      </div>
      <div class="helper-card">
        <div class="helper-avatar" style="background:#a98fd4;">AR<div class="online-dot" style="position:absolute;bottom:0;right:0;width:12px;height:12px;background:#34c759;border:2px solid white;border-radius:50%;"></div></div>
        <div class="helper-name">Ava R.</div>
        <div class="helper-stars">★★★★★</div>
        <div class="helper-dist">0.8km away</div>
      </div>
      <div class="helper-card">
        <div class="helper-avatar" style="background:#6b5ca5;">TC<div class="online-dot" style="position:absolute;bottom:0;right:0;width:12px;height:12px;background:#34c759;border:2px solid white;border-radius:50%;"></div></div>
        <div class="helper-name">Tom C.</div>
        <div class="helper-stars">★★★★☆</div>
        <div class="helper-dist">1.2km away</div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active">
      <div class="tab-icon">🗺️</div>
      <div class="tab-label" style="color:#7c5cbf;">Find Help</div>
    </div>
    <div class="tab">
      <div class="tab-icon">📋</div>
      <div class="tab-label">Sessions</div>
    </div>
    <div class="tab">
      <div class="tab-icon">👤</div>
      <div class="tab-label">Profile</div>
    </div>
  </div>
</div>
</div></body>
</html>
